[theme]
# Primary accent color for interactive elements.
primaryColor = "#5CF633"

# Background color for the main content area.
backgroundColor = "#505C71"

# Background color used for the sidebar and most interactive widgets.
secondaryBackgroundColor = "#434654"

# Color used for almost all text.
textColor = "#FFFFFF"

# Font family for all text in the app, except code blocks. One of "sans serif", "serif", or "monospace".
font = "serif"

[client]
# Must be true (the default) now that EyeOnData.py uses st.navigation —
# false suppresses the st.navigation sidebar menu entirely. It was
# originally false to hide the auto-generated pages/ nav when the app
# drew its own menu with st.sidebar.page_link.
showSidebarNavigation = true
